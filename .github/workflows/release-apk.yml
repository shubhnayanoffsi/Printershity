name: Publish APK to GitHub Releases

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Update v2.0.0 Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f v2.0.0
          git push origin v2.0.0 --force
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 Brother-HL1201-Print.apk --clobber
          else
            gh release create v2.0.0 Brother-HL1201-Print.apk \
              --title "Printshity v2.0.0 — Brother HL-1201 Android APK" \
              --notes "Brother HL-1201 USB OTG Android app. Version 2.0 targets API 35 for current Android devices."
          fi
