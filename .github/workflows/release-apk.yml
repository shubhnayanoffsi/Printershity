name: Publish APK to GitHub Releases

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Update v1.0.0 Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f v1.0.0
          git push origin v1.0.0 --force
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Brother-HL1201-Print.apk --clobber
          else
            gh release create v1.0.0 Brother-HL1201-Print.apk \
              --title "Printify v1.0.0 — Brother HL-1201 USB OTG APK" \
              --notes "Direct USB-A to USB-B + Type-C OTG Android APK (Brother-HL1201-Print.apk) for the Brother HL-1201 monochrome laser printer."
          fi
